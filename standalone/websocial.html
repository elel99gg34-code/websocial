<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>websocial — 자동화 웹소설</title>
<style>
:root{--bg:#faf9f7;--panel:#fff;--line:#e3dfd7;--text:#1b1917;--muted:#6c665d;
 --accent:#8a5a2b;--soft:#f4ede4;--ok:#2f6b46;--warn:#96660f;--err:#a5382a}
@media(prefers-color-scheme:dark){:root{--bg:#151419;--panel:#1e1d23;--line:#33313a;--text:#e9e6e1;
 --muted:#9a948b;--accent:#d9a441;--soft:#2a2620;--ok:#63b184;--warn:#d9a441;--err:#e0705c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
 font:15px/1.65 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
 padding:11px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
header b{font-size:16px}
header .ver{color:var(--muted);font-size:12px}
.sp{flex:1}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
textarea{width:100%;font:15px/2 inherit;resize:vertical}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.g{background:transparent;color:var(--accent);border:1px solid var(--line)}
button.s{padding:4px 10px;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed}
main{max-width:1080px;margin:0 auto;padding:18px}
nav{display:flex;gap:4px;margin-bottom:15px;flex-wrap:wrap}
nav button{background:transparent;color:var(--muted);border-radius:8px;padding:7px 13px}
nav button.on{background:var(--soft);color:var(--accent);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:15px}
.card h3{margin:14px 0 6px;font-size:14px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(185px,1fr))}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted)}
tr.click{cursor:pointer}tr.click:hover{background:var(--soft)}
.tag{display:inline-block;white-space:nowrap;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--soft);color:var(--muted)}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.err{color:var(--err)}
.muted{color:var(--muted)}
.stat{font-size:23px;font-weight:600}
.log{background:#0d0d10;color:#d6d2cb;border-radius:10px;padding:13px;height:230px;overflow:auto;
 font:12.5px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.log .step{color:#6fc3e8}.log .ok{color:#7fd6a0}.log .warn{color:#e8c56f}.log .err{color:#f08a76}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.split{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
@media(max-width:880px){.split{grid-template-columns:1fr}}
pre.raw{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;
 font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word;
 max-height:240px;overflow:auto;margin:8px 0 0}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);
 padding:20px;max-width:780px;width:94vw}
dialog::backdrop{background:rgba(0,0,0,.5)}
.pv{border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px}
.pv.on{border-color:var(--accent);background:var(--soft)}
.pv .hd{display:flex;gap:8px;align-items:center;cursor:pointer;margin:0}
.pv .hd input{width:auto;flex:none;margin:0}
.pv .hd b{font-size:15px}
.pv .fl{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));margin-top:9px}
.pv .fl input{width:100%}
a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <b>websocial</b><span class="ver" id="ver"></span>
  <select id="pick"></select>
  <button class="g s" id="bNew">새 작품</button>
  <div class="sp"></div>
  <span class="tag" id="badge"></span>
  <button class="g s" id="bSet">설정</button>
</header>
<main id="app"></main>

<dialog id="dSet">
  <h2 style="margin-top:0">API 설정</h2>
  <p class="muted" style="font-size:13px;margin-top:-4px">
    쓸 곳의 키를 넣고 왼쪽 동그라미로 고르세요. 키는 이 브라우저에만 저장되고 파일에는 안 들어갑니다.<br>
    <b>먼저 [테스트]를 눌러 되는 곳을 찾으세요.</b> 실패하면 원인이 그 자리에 그대로 표시됩니다.
  </p>
  <div id="pvs"></div>
  <div class="row" style="margin-top:13px;justify-content:flex-end">
    <button class="g" id="bClose">닫기</button>
    <button id="bSave">저장</button>
  </div>
</dialog>

<dialog id="dNew">
  <h2 style="margin-top:0">새 작품</h2>
  <div><label>한 줄 아이디어 (필수)</label>
    <input id="f-idea" style="width:100%" placeholder="재벌가 망나니가 파산 직전으로 회귀해 그룹을 재건한다"></div>
  <div class="grid" style="margin-top:11px">
    <div><label>제목</label><input id="f-title" placeholder="회귀한 망나니 도련님"></div>
    <div><label>장르</label><input id="f-genre" value="현대판타지"></div>
    <div><label>플랫폼</label><input id="f-plat" value="문피아"></div>
    <div><label>독자층</label><input id="f-read" value="20~40대 남성 독자"></div>
    <div><label>총 회차</label><input id="f-eps" type="number" value="20" min="1"></div>
    <div><label>회차 글자수</label><input id="f-chars" type="number" value="5200" min="800"></div>
  </div>
  <p id="newErr" class="muted" style="font-size:13px"></p>
  <div class="row" style="margin-top:12px;justify-content:flex-end">
    <button class="g" id="bCancel">취소</button>
    <button id="bCreate">만들기</button>
  </div>
</dialog>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════
 * websocial — 자동화 웹소설 (단독 실행판)
 * 설계 원칙
 *  1. 스트리밍 없음. 평범한 POST 하나와 JSON 응답 하나만 쓴다.
 *  2. 커스텀 헤더를 최소로 쓴다. 브라우저가 막을 여지를 줄인다.
 *  3. 실패하면 원인을 감추지 않는다. 주소·상태·서버 응답 원문을 그대로 보여준다.
 * ════════════════════════════════════════════════════════════ */
const VERSION = "v6";
const $ = (id) => document.getElementById(id);
const el = (t, p = {}, ...k) => {
  const n = Object.assign(document.createElement(t), p);
  for (const c of k.flat()) if (c != null && c !== false) n.append(c);
  return n;
};
const N = (v) => Number(v ?? 0).toLocaleString("ko-KR");

/* ── 제공자 ───────────────────────────────────────────────── */
const PV = {
  gemini: {
    name: "Google Gemini", kind: "gemini", model: "gemini-2.5-flash", tier: "무료 티어",
    keyUrl: "https://aistudio.google.com/apikey",
    tip: "키를 주소에 실어 보내므로 브라우저가 막을 여지가 가장 적습니다. 무료 티어로 먼저 써보기 좋습니다.",
  },
  anthropic: {
    name: "Anthropic Claude", kind: "anthropic", model: "claude-opus-5", tier: "유료",
    keyUrl: "https://console.anthropic.com/",
    tip: "한국어 장문 품질이 가장 좋습니다. 브라우저 직접 호출을 허용하는 것을 확인했습니다.",
  },
  groq: {
    name: "Groq", kind: "openai", base: "https://api.groq.com/openai/v1",
    model: "llama-3.3-70b-versatile", tier: "무료 티어", keyUrl: "https://console.groq.com/keys",
    tip: "무료 티어가 있고 매우 빠릅니다.",
  },
  xai: {
    name: "xAI Grok", kind: "openai", base: "https://api.x.ai/v1", model: "grok-4",
    tier: "유료", keyUrl: "https://console.x.ai/",
    tip: "모델명이 자주 바뀝니다. [모델] 버튼으로 실제 이름을 받아오세요.",
  },
  openrouter: {
    name: "OpenRouter", kind: "openai", base: "https://openrouter.ai/api/v1",
    model: "deepseek/deepseek-chat-v3-0324:free", tier: "일부 무료",
    keyUrl: "https://openrouter.ai/keys", tip: "모델명 뒤에 :free 가 붙은 것은 무료입니다.",
  },
  custom: {
    name: "직접 입력 (Ollama 등)", kind: "openai", base: "http://localhost:11434/v1",
    model: "qwen2.5:14b", tier: "로컬 무료", keyUrl: "https://ollama.com/",
    tip: "로컬 모델은 완전 무료입니다. Ollama 는 OLLAMA_ORIGINS=* 로 띄워야 브라우저에서 불립니다.",
  },
};

/* ── 저장소 ───────────────────────────────────────────────── */
const SK = "ws6.settings", PK = "ws6.projects";
function getConf() {
  const raw = JSON.parse(localStorage.getItem(SK) || "{}");
  const c = { active: raw.active || "gemini", e: raw.e || {} };
  for (const [id, v] of Object.entries(PV)) {
    const x = c.e[id] || {};
    c.e[id] = { key: x.key || "", model: x.model || v.model, base: x.base || v.base || "" };
  }
  if (!PV[c.active]) c.active = "gemini";
  return c;
}
const setConf = (c) => localStorage.setItem(SK, JSON.stringify(c));
function activeCfg() {
  const c = getConf();
  return { id: c.active, ...c.e[c.active] };
}
const getProjects = () => JSON.parse(localStorage.getItem(PK) || "{}");
function setProjects(p) {
  try { localStorage.setItem(PK, JSON.stringify(p)); }
  catch { alert("브라우저 저장 공간이 찼습니다. 오래된 작품을 지우거나 백업 후 정리하세요."); }
}
const S = { id: "", tab: "work", ep: null, busy: false };
const proj = () => getProjects()[S.id] || null;
function edit(fn) {
  const all = getProjects(), p = all[S.id];
  if (!p) return null;
  fn(p); all[S.id] = p; setProjects(all); return p;
}

/* ── 오류: 원인을 감추지 않는다 ────────────────────────────── */
class ApiError extends Error {
  constructor(msg, detail) { super(msg); this.detail = detail || ""; }
}

/* ── API 호출 (비스트리밍 단일 요청) ──────────────────────── */
function buildCall(cfg, system, user, maxTokens) {
  const v = PV[cfg.id], sys = system.filter(Boolean).join("\n\n");
  if (v.kind === "gemini") {
    return {
      url: `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cfg.model)}:generateContent?key=${encodeURIComponent(cfg.key)}`,
      headers: { "content-type": "application/json" },  // 커스텀 헤더 없음
      body: {
        ...(sys ? { systemInstruction: { parts: [{ text: sys }] } } : {}),
        contents: [{ role: "user", parts: [{ text: user }] }],
        generationConfig: { maxOutputTokens: maxTokens },
      },
      read: (j) => {
        const c = (j.candidates || [])[0] || {};
        return {
          text: ((c.content || {}).parts || []).map((p) => p.text || "").join(""),
          stop: c.finishReason || (j.promptFeedback || {}).blockReason || "",
          usage: { in: (j.usageMetadata || {}).promptTokenCount || 0, out: (j.usageMetadata || {}).candidatesTokenCount || 0 },
        };
      },
    };
  }
  if (v.kind === "anthropic") {
    return {
      url: "https://api.anthropic.com/v1/messages",
      headers: {
        "content-type": "application/json", "x-api-key": cfg.key,
        "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true",
      },
      body: {
        model: cfg.model, max_tokens: maxTokens,
        ...(sys ? { system: sys } : {}),
        messages: [{ role: "user", content: user }],
      },
      read: (j) => ({
        text: (j.content || []).filter((b) => b.type === "text").map((b) => b.text).join(""),
        stop: j.stop_reason || "",
        usage: { in: (j.usage || {}).input_tokens || 0, out: (j.usage || {}).output_tokens || 0 },
      }),
    };
  }
  const base = (cfg.base || v.base || "").replace(/\/+$/, "");
  return {
    url: `${base}/chat/completions`,
    headers: { "content-type": "application/json", ...(cfg.key ? { authorization: `Bearer ${cfg.key}` } : {}) },
    body: {
      model: cfg.model, max_tokens: maxTokens,
      messages: [...(sys ? [{ role: "system", content: sys }] : []), { role: "user", content: user }],
    },
    read: (j) => {
      const c = (j.choices || [])[0] || {};
      return {
        text: (c.message || {}).content || "",
        stop: c.finish_reason || "",
        usage: { in: (j.usage || {}).prompt_tokens || 0, out: (j.usage || {}).completion_tokens || 0 },
      };
    },
  };
}

let ABORT = null;

async function ask(cfg, { system = [], user, maxTokens = 8000 }) {
  if (!cfg.key && !/localhost|127\.0\.0\.1/.test(cfg.base || "")) {
    throw new ApiError("API 키가 비어 있습니다. 설정에서 키를 넣으세요.");
  }
  const c = buildCall(cfg, system, user, maxTokens);
  ABORT = new AbortController();

  let res;
  try {
    res = await fetch(c.url, { method: "POST", headers: c.headers, body: JSON.stringify(c.body), signal: ABORT.signal });
  } catch (err) {
    if (err.name === "AbortError") throw err;
    throw new ApiError(
      `${PV[cfg.id].name} 에 요청을 보내지 못했습니다.`,
      `브라우저가 알려준 내용: ${err.message}\n요청 주소: ${c.url.replace(/key=[^&]*/, "key=***")}\n\n` +
      `이 단계에서 막히는 원인은 셋 중 하나입니다.\n` +
      `· 인터넷/방화벽이 이 주소를 막고 있다\n` +
      `· 이 제공자가 브라우저에서 오는 요청을 허용하지 않는다\n` +
      `· 주소(Base URL)가 틀렸다\n\n` +
      `[테스트] 옆의 [진단] 을 누르면 셋 중 무엇인지 가려 줍니다.`);
  }

  const raw = await res.text();
  let json = null;
  try { json = JSON.parse(raw); } catch { /* 본문이 JSON 이 아닐 수 있다 */ }

  if (!res.ok) {
    const server = (json && json.error && (json.error.message || json.error.type)) || raw.slice(0, 500);
    const hint = res.status === 401 || res.status === 403 ? "키가 거부됐습니다. 키를 다시 확인하세요(앞뒤 공백·줄바꿈 주의)."
      : res.status === 404 ? "모델 이름이나 주소가 틀렸습니다. [모델] 버튼으로 쓸 수 있는 이름을 받아오세요."
      : res.status === 429 ? "요청 한도를 넘었습니다. 잠시 뒤 다시 시도하세요."
      : res.status >= 500 ? "제공자 서버 문제입니다. 잠시 뒤 다시 시도하세요." : "";
    throw new ApiError(`HTTP ${res.status} — ${hint || "요청이 거부됐습니다."}`,
      `요청 주소: ${c.url.replace(/key=[^&]*/, "key=***")}\n모델: ${cfg.model}\n\n서버 응답:\n${server}`);
  }

  const out = c.read(json || {});
  ABORT = null;
  if (!out.text.trim()) {
    const why = /SAFETY|PROHIBITED|BLOCK|refusal/i.test(out.stop)
      ? "모델이 안전 정책상 응답을 거절했습니다. 소재 수위를 낮추거나 다른 제공자를 쓰세요."
      : /MAX_TOKENS|max_tokens|length/i.test(out.stop)
        ? `출력 한도(${maxTokens} 토큰)에 걸려 본문이 나오지 않았습니다. 회차 글자수를 줄이거나 다른 모델을 쓰세요.`
        : "모델이 빈 응답을 돌려줬습니다.";
    throw new ApiError(why, `중단 사유: ${out.stop || "알 수 없음"}\n\n서버 응답:\n${raw.slice(0, 800)}`);
  }
  bill(cfg, out.usage);
  return out.text.trim();
}

/* 대략적인 비용 추적 (1M 토큰당 USD) */
const PRICE = { "claude-opus-5": [5, 25], "claude-opus-4-8": [5, 25], "claude-sonnet-5": [3, 15], "claude-haiku-4-5": [1, 5] };
function bill(cfg, u) {
  edit((p) => {
    p.usage = p.usage || { calls: 0, in: 0, out: 0, usd: 0 };
    p.usage.calls++; p.usage.in += u.in; p.usage.out += u.out;
    const r = PRICE[cfg.model];
    if (r) p.usage.usd += (u.in * r[0] + u.out * r[1]) / 1e6;
  });
}

/* ── 진단: 무엇이 막는지 단계로 가른다 ────────────────────── */
function listUrl(cfg) {
  const v = PV[cfg.id];
  if (v.kind === "gemini") return `https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(cfg.key)}`;
  if (v.kind === "anthropic") return "https://api.anthropic.com/v1/models?limit=100";
  return `${(cfg.base || v.base || "").replace(/\/+$/, "")}/models`;
}
function listHeaders(cfg) {
  const v = PV[cfg.id];
  if (v.kind === "anthropic") return { "x-api-key": cfg.key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" };
  if (v.kind === "openai" && cfg.key) return { authorization: `Bearer ${cfg.key}` };
  return {};
}

async function diagnose(cfg) {
  const v = PV[cfg.id], url = listUrl(cfg), L = [];
  const safe = url.replace(/key=[^&]*/, "key=***");
  const safari = /^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent);

  let reached = false;
  try { await fetch(url, { mode: "no-cors" }); reached = true; } catch { reached = false; }
  L.push(`1) ${v.name} 서버까지 닿는가 … ${reached ? "예" : "아니오"}`);
  if (!reached) {
    L.push("", "→ 인터넷·방화벽 문제입니다. 이 주소와 통신 자체가 안 됩니다.",
      "   회사/학교 네트워크, 백신, 브라우저 확장이 막는 경우가 많습니다.",
      "   휴대폰 핫스팟 등 다른 네트워크에서 한 번 해보세요.", "", `확인한 주소: ${safe}`);
    return L.join("\n");
  }

  let ok = false, status = 0, body = "", errMsg = "";
  try {
    const r = await fetch(url, { headers: listHeaders(cfg) });
    ok = true; status = r.status; body = (await r.text()).slice(0, 400);
  } catch (e) { errMsg = e.message; }
  L.push(`2) 브라우저에서 온 요청을 받아주는가 … ${ok ? "예" : "아니오"}`);
  if (!ok) {
    L.push("", `→ ${v.name} 가 브라우저에서 오는 요청을 거부합니다. 키와 무관합니다.`,
      "   이 제공자는 이 HTML 파일로는 쓸 수 없습니다.", "",
      "   대안", "   · Google Gemini 나 Anthropic Claude 로 바꿔 보세요.",
      "   · 로컬 Ollama 는 OLLAMA_ORIGINS=* 로 띄우면 됩니다.",
      safari ? "   · Safari 는 로컬 파일의 통신을 특히 강하게 막습니다. Chrome 으로 열어보세요." : "",
      "", `브라우저가 알려준 내용: ${errMsg}`);
    return L.filter((x) => x !== "").join("\n");
  }

  L.push(`3) 서버 응답 … HTTP ${status}`);
  if (status === 401 || status === 403) L.push("", "→ 통신은 됩니다. 키가 거부됐습니다.", "   키 앞뒤 공백·줄바꿈, 활성화 여부를 확인하세요.", "", `서버 응답: ${body}`);
  else if (status === 404) L.push("", "→ 주소가 틀렸습니다. Base URL 을 확인하세요.", "", `서버 응답: ${body}`);
  else if (status < 300) L.push("", "→ 연결·인증 모두 정상입니다. 바로 쓸 수 있습니다.");
  else L.push("", "→ 예상치 못한 응답입니다.", "", `서버 응답: ${body}`);
  return L.join("\n");
}

async function fetchModels(cfg) {
  const res = await fetch(listUrl(cfg), { headers: listHeaders(cfg) });
  const raw = await res.text();
  if (!res.ok) throw new ApiError(`HTTP ${res.status}`, raw.slice(0, 400));
  const j = JSON.parse(raw);
  const ids = (j.data || j.models || []).map((m) => String(m.id || m.name || "").replace(/^models\//, "")).filter(Boolean);
  if (!ids.length) throw new ApiError("모델 목록이 비어 있습니다.", raw.slice(0, 300));
  return ids.sort();
}

function check(v, sp, path = "") {
  const e = [];
  if (typeof sp === "string") {
    const t = sp === "s" ? "string" : "number";
    if (typeof v !== t) e.push(`${path || "(root)"}: ${t} 이어야 함`);
    return e;
  }
  if (Array.isArray(sp)) {
    if (!Array.isArray(v)) return [`${path}: 배열이어야 함`];
    v.forEach((x, i) => e.push(...check(x, sp[0], `${path}[${i}]`)));
    return e;
  }
  if (typeof v !== "object" || v === null || Array.isArray(v)) return [`${path || "(root)"}: 객체여야 함`];
  for (const [k, s] of Object.entries(sp)) {
    if (!(k in v)) { e.push(`${path ? path + "." : ""}${k}: 없음`); continue; }
    e.push(...check(v[k], s, `${path ? path + "." : ""}${k}`));
  }
  return e;
}
function shape(sp) {
  if (sp === "s") return "문자열";
  if (sp === "n") return 0;
  if (Array.isArray(sp)) return [shape(sp[0])];
  const o = {}; for (const [k, s] of Object.entries(sp)) o[k] = shape(s); return o;
}
function grabJson(raw) {
  const f = /```(?:json)?\s*([\s\S]*?)```/i.exec(raw);
  const b = (f ? f[1] : raw).trim();
  const i = b.search(/[[{]/); if (i < 0) return null;
  const open = b[i], close = open === "{" ? "}" : "]";
  let d = 0, str = false, esc = false;
  for (let k = i; k < b.length; k++) {
    const ch = b[k];
    if (str) { if (esc) esc = false; else if (ch === "\\") esc = true; else if (ch === '"') str = false; continue; }
    if (ch === '"') str = true; else if (ch === open) d++; else if (ch === close && --d === 0) return b.slice(i, k + 1);
  }
  return null;
}

async function askJson(cfg, sp, { system, user, maxTokens = 8000 }) {
  const instr = `\n\n## 출력 형식\n아래 구조에 정확히 맞는 JSON 객체 하나만 출력하라. 설명·코드펜스 없이 JSON만.\n모든 필드는 필수다. 값이 없으면 빈 문자열이나 빈 배열을 넣는다. 한국어로 쓴다.\n\n${JSON.stringify(shape(sp), null, 1)}`;
  const parse = (raw) => {
    const b = grabJson(raw);
    if (!b) return { e: "응답에서 JSON 을 찾지 못했습니다." };
    let v; try { v = JSON.parse(b); } catch (x) { return { e: "JSON 문법 오류: " + x.message }; }
    const errs = check(v, sp);
    return errs.length ? { e: errs.slice(0, 6).join("\n") } : { v };
  };
  const a = await ask(cfg, { system, user: user + instr, maxTokens });
  let r = parse(a);
  if (r.v) return r.v;
  say("warn", "형식이 안 맞아 한 번 더 요청합니다.");
  const b = await ask(cfg, { system, user: `${user}${instr}\n\n── 직전 응답이 형식 검증에 실패했다. 아래 오류를 고쳐 JSON만 다시 출력하라. ──\n[직전 응답]\n${a.slice(0, 3000)}\n\n[오류]\n${r.e}`, maxTokens });
  r = parse(b);
  if (r.v) return r.v;
  throw new ApiError("형식 검증에 두 번 실패했습니다.", `마지막 오류:\n${r.e}\n\n모델 응답 앞부분:\n${b.slice(0, 600)}`);
}

/* ── 규칙 검수 ────────────────────────────────────────────── */
const BAN = ["묘한 이질감", "알 수 없는 감정", "복잡한 심경", "형언할 수 없는", "그것은 시작에 불과했다"];
const METAP = [[/제\s*\d+\s*화/, "회차 번호"], [/다음\s*화에\s*계속/, "연재 안내"], [/작가의\s*말/, "작가의 말"], [/^\s*#{1,6}\s+\S/m, "마크다운 헤딩"]];
function inspect(text, target) {
  const paras = text.split(/\n\s*\n/).map((x) => x.trim()).filter(Boolean);
  const sents = paras.flatMap((p) => p.split(/(?<=[.!?…])\s+/)).map((x) => x.trim()).filter(Boolean);
  const chars = [...text].length, min = Math.round(target * 0.88), max = Math.round(target * 1.12);
  const ns = text.replace(/\s/g, "").length;
  const q = text.match(/"[^"]{1,400}"/g) || [];
  const ratio = ns ? q.reduce((s, m) => s + m.replace(/\s/g, "").length, 0) / ns : 0;
  const avg = sents.length ? sents.reduce((s, x) => s + x.length, 0) / sents.length : 0;
  const longP = paras.filter((p) => p.length > 120).length;
  const ends = sents.map((s) => s.replace(/["\s]+$/, "").replace(/[.!?…]+$/, "").slice(-2));
  let run = 0, best = 0, prev = "";
  for (const e of ends) { run = e && e === prev ? run + 1 : 1; prev = e; best = Math.max(best, run); }
  const toks = text.replace(/["「」]/g, " ").split(/\s+/).map((t) => t.replace(/[.,!?…]+$/, "")).filter(Boolean);
  const g = new Map();
  for (let i = 0; i + 4 <= toks.length; i++) { const k = toks.slice(i, i + 4).join(" "); g.set(k, (g.get(k) || 0) + 1); }
  const rep = [...g.entries()].filter(([, c]) => c > 2).sort((a, b) => b[1] - a[1]).slice(0, 4);
  const ban = BAN.filter((b) => text.includes(b));
  const meta = METAP.filter(([r]) => r.test(text)).map(([, w]) => w);
  const M = (label, lv, ok, val, det = "") => ({ label, lv, ok, val, det });
  const ms = [
    M("분량(공백 포함)", "err", chars >= min && chars <= max, `${N(chars)}자`, `허용 ${N(min)}~${N(max)}자`),
    M("금칙 표현", "err", !ban.length, ban.length ? `${ban.length}건` : "없음", ban.join(" / ")),
    M("본문 오염", "err", !meta.length, meta.length ? `${meta.length}건` : "없음", meta.join(" / ")),
    M("대사 비율", "warn", ratio >= 0.2 && ratio <= 0.6, `${(ratio * 100).toFixed(1)}%`, "권장 20~60%"),
    M("평균 문장 길이", "warn", avg <= 45, `${avg.toFixed(1)}자`, "권장 45자 이하"),
    M("긴 문단", "warn", paras.length ? longP / paras.length <= 0.15 : true, `${longP}/${paras.length}개`, "120자 초과"),
    M("반복 표현", "warn", !rep.length, rep.length ? `${rep.length}종` : "없음", rep.map(([k, c]) => `"${k}" ${c}회`).join(" / ")),
    M("종결어미 연속", "warn", best <= 3, `${best}연속`, ""),
  ];
  return { chars, ms, errs: ms.filter((m) => m.lv === "err" && !m.ok), warns: ms.filter((m) => m.lv === "warn" && !m.ok) };
}

function applyDigest(n, d) {
  edit((x) => {
    const known = new Set(x.canon.map((f) => f.text.trim()));
    for (const f of d.facts) {
      const t = (f.text || "").trim();
      if (!t || known.has(t)) continue;
      known.add(t); x.canon.push({ text: t, who: f.who || [], ep: n });
    }
    for (const f of d.planted) {
      const id = (f.id || "").trim();
      if (!id || x.fs.some((i) => i.id === id)) continue;
      x.fs.push({ id, desc: f.desc, at: n, resolved: 0 });
    }
    for (const id of d.resolved) {
      const i = x.fs.find((v) => v.id === (id || "").trim());
      if (i && !i.resolved) i.resolved = n;
    }
  });
}

async function run(target) {
  if (S.busy) return;
  S.busy = true; badge("실행 중…", "warn"); draw();
  const cfg = activeCfg();
  try {
    let p = proj();
    if (!p.concept) { await doConcept(cfg, p); p = proj(); }
    if (!p.bible) { await doBible(cfg, p); p = proj(); }
    if (!p.outline) { await doOutline(cfg, p, p.total); p = proj(); }
    const last = Math.min(target, p.outline.episodes.length);
    for (let n = 1; n <= last; n++) {
      if ((proj().eps[n] || {}).status === "final") continue;
      if (await doEpisode(cfg, n) === "needs_human") break;
    }
    say("ok", "진행 완료");
  } catch (e) {
    if (e.name === "AbortError") say("warn", "중단했습니다.");
    else { say("err", e.message); if (e.detail) say("err", e.detail); }
  } finally { S.busy = false; badge(""); draw(); }
}

        el("p", { style: "font-size:13px;margin:6px 0 0" }, el("b", { textContent: "목표: " }), c.goal))))),
    b.glossary.length ? el("div", { className: "card" }, el("h2", { textContent: "용어" }),
      el("table", {}, el("tbody", {}, b.glossary.map((g) => el("tr", {},
        el("td", { style: "width:150px" }, el("b", { textContent: g.term })), el("td", { className: "muted", textContent: g.meaning })))))) : null,
  ];
}

function canonTab(p) {
  const open = openFs(p), closed = p.fs.filter((f) => f.resolved);
  return [
    el("div", { className: "card" }, el("h2", { textContent: `미회수 복선 ${open.length}건` }),
      open.length ? el("table", {}, el("tbody", {}, open.map((f) => el("tr", {},
        el("td", { style: "width:80px" }, el("span", { className: "tag warn", textContent: `${f.at}화` })),
        el("td", { textContent: f.desc }))))) : el("p", { className: "muted", textContent: "없음" }),
      closed.length ? el("p", { className: "muted", style: "font-size:13px", textContent: `회수 완료 ${closed.length}건` }) : null),
    el("div", { className: "card" }, el("h2", { textContent: `확정 사실 ${p.canon.length}건` }),
      el("p", { className: "muted", style: "font-size:13px;margin-top:-6px", textContent: "다음 회차 집필에 그대로 주입됩니다." }),
      el("div", { style: "max-height:420px;overflow:auto" }, el("table", {}, el("tbody", {}, p.canon.slice().reverse().map((f) =>
        el("tr", {}, el("td", { style: "width:64px" }, el("span", { className: "tag", textContent: `${f.ep}화` })), el("td", { textContent: f.text })))))))
  ];
}

function draw() {
  const app = $("app");
  const keep = $("logBox") ? [...$("logBox").children].map((c) => [c.className, c.textContent]) : [];
  app.innerHTML = "";
  const p = proj();
  if (!p) {
    app.append(el("div", { className: "card" }, el("h2", { textContent: "시작하기" }),
      el("ol", { style: "padding-left:20px;line-height:2.1" },
        el("li", {}, "오른쪽 위 ", el("b", { textContent: "설정" }), " 에서 키를 넣고 ", el("b", { textContent: "[테스트]" }), " 로 되는 곳을 찾습니다."),
        el("li", {}, el("b", { textContent: "새 작품" }), " 을 눌러 아이디어 한 줄을 적습니다."),
        el("li", {}, el("b", { textContent: "연재 진행" }), " 을 누르면 기획 → 설정집 → 회차표 → 집필까지 알아서 진행됩니다.")),
      el("p", { className: "muted", style: "font-size:13px;margin-bottom:0", textContent: "모든 데이터는 이 브라우저에만 저장됩니다. 서버로 보내지 않습니다." })));
    return;
  }
  app.append(tabs());
  const v = S.tab === "work" ? workTab(p) : S.tab === "eps" ? epsTab(p) : S.tab === "bible" ? bibleTab(p) : canonTab(p);
  for (const node of [v].flat()) if (node) app.append(node);
  const b = $("logBox");
  if (b) { for (const [c, t] of keep) b.append(el("div", { className: c, textContent: t })); b.scrollTop = b.scrollHeight; }
}

function refresh() {
  const all = getProjects(), sel = $("pick");
  sel.innerHTML = "";
  const ids = Object.keys(all);
  if (!ids.length) { sel.append(el("option", { textContent: "작품 없음" })); S.id = ""; return; }
  for (const id of ids) sel.append(el("option", { value: id, textContent: all[id].title }));
  if (!all[S.id]) S.id = ids[0];
  sel.value = S.id;
}

/* ── 설정 화면 ────────────────────────────────────────────── */
function pvCard(id, e, on) {
  const v = PV[id], out = el("pre", { className: "raw", style: "display:none" });
  const f = (k, label, val, ph = "") => {
    const i = el("input", { type: k === "key" ? "password" : "text", value: val, placeholder: ph });
    i.dataset.f = k;
    return el("div", {}, el("label", { textContent: label }), i);
  };
  const card = el("div", { className: "pv" + (on ? " on" : "") },
    el("label", { className: "hd" },
      el("input", { type: "radio", name: "act", value: id, checked: on,
        onchange: () => document.querySelectorAll(".pv").forEach((c) => c.classList.toggle("on", c.dataset.id === id)) }),
      el("b", { textContent: v.name }), el("span", { className: "tag", textContent: v.tier })),
    el("div", { className: "muted", style: "font-size:12px;margin-top:5px" }, v.tip, el("br"),
      "키 발급: ", el("a", { href: v.keyUrl, target: "_blank", rel: "noopener", textContent: v.keyUrl })),
    el("div", { className: "fl" },
      f("key", "API 키", e.key, id === "custom" ? "로컬이면 비워두세요" : "여기에 붙여넣기"),
      v.kind === "openai" ? f("base", "Base URL", e.base || v.base || "") : null,
      f("model", "모델", e.model || v.model)),
    el("div", { className: "row", style: "margin-top:9px" },
      el("button", { className: "g s", textContent: "테스트", onclick: async (ev) => {
        const b = ev.target; b.disabled = true;
        out.style.display = ""; out.textContent = "테스트 중…";
        try {
          const t = await ask(rowCfg(card), { system: ["짧게 한국어로 답한다."], user: "연결 확인용이다. '연결 성공' 이라고만 답하라.", maxTokens: 2048 });
          out.textContent = `성공 — 모델 응답: ${t.slice(0, 60)}`;
          out.style.color = "var(--ok)";
        } catch (err) {
          out.style.color = "var(--err)";
          out.textContent = `${err.message}\n\n${err.detail || ""}\n\n──── 자동 진단 ────\n확인 중…`;
          try { out.textContent = `${err.message}\n\n${err.detail || ""}\n\n──── 자동 진단 ────\n${await diagnose(rowCfg(card))}`; }
          catch (e2) { out.textContent += "\n진단 실패: " + e2.message; }
        } finally { b.disabled = false; }
      } }),
      el("button", { className: "g s", textContent: "진단", onclick: async (ev) => {
        const b = ev.target; b.disabled = true;
        out.style.display = ""; out.style.color = ""; out.textContent = "진단 중…";
        try { out.textContent = await diagnose(rowCfg(card)); }
        catch (err) { out.textContent = "진단 실패: " + err.message; }
        finally { b.disabled = false; }
      } }),
      el("button", { className: "g s", textContent: "모델", onclick: async (ev) => {
        const b = ev.target; b.disabled = true;
        out.style.display = ""; out.style.color = ""; out.textContent = "모델 목록 불러오는 중…";
        try {
          const ids = await fetchModels(rowCfg(card));
          out.style.color = "var(--ok)";
          out.textContent = `쓸 수 있는 모델 ${ids.length}개\n\n${ids.join("\n")}`;
          const mi = card.querySelector('[data-f="model"]');
          if (!ids.includes(mi.value)) { mi.value = ids[0]; out.textContent = `모델 칸을 ${ids[0]} 로 바꿨습니다.\n\n${out.textContent}`; }
        } catch (err) { out.style.color = "var(--err)"; out.textContent = `${err.message}\n${err.detail || ""}`; }
        finally { b.disabled = false; }
      } }),
      el("button", { className: "g s", textContent: "복사", title: "위 내용을 클립보드로 복사합니다", onclick: async () => {
        const t = `[${v.name} / ${rowCfg(card).model}] ${location.protocol} ${navigator.userAgent}\n\n${out.textContent}`;
        try { await navigator.clipboard.writeText(t); alert("복사했습니다."); } catch { prompt("복사해 주세요", t); }
      } })),
    out);
  card.dataset.id = id;
  return card;
}
function rowCfg(card) {
  const g = (k) => { const i = card.querySelector(`[data-f="${k}"]`); return i ? i.value.trim() : ""; };
  return { id: card.dataset.id, key: g("key"), model: g("model") || PV[card.dataset.id].model, base: g("base") };
}
function drawSettings() {
  const c = getConf(), box = $("pvs");
  box.innerHTML = "";
  for (const id of Object.keys(PV)) box.append(pvCard(id, c.e[id], id === c.active));
}

$("bSet").onclick = () => { drawSettings(); $("dSet").showModal(); };
$("bClose").onclick = () => $("dSet").close();
$("bSave").onclick = () => {
  const c = { active: getConf().active, e: {} };
  for (const card of document.querySelectorAll(".pv")) {
    const r = rowCfg(card);
    c.e[r.id] = { key: r.key, model: r.model, base: r.base };
    if (card.querySelector('input[type="radio"]').checked) c.active = r.id;
  }
  setConf(c); $("dSet").close(); draw();
};
$("bNew").onclick = () => { $("newErr").textContent = ""; $("dNew").showModal(); };
$("bCancel").onclick = () => $("dNew").close();
$("bCreate").onclick = () => {
  const idea = $("f-idea").value.trim();
  if (!idea) { $("newErr").textContent = "아이디어를 한 줄 적어주세요."; return; }
  const id = `p${Date.now().toString(36)}`;
  const all = getProjects();
  all[id] = {
    id, title: $("f-title").value.trim() || idea.slice(0, 18), idea,
    genre: $("f-genre").value.trim() || "현대판타지", plat: $("f-plat").value.trim() || "문피아",
    read: $("f-read").value.trim() || "20~40대 남성 독자",
    total: Math.max(1, Number($("f-eps").value) || 20),
    chars: Math.max(800, Number($("f-chars").value) || 5200),
    created: new Date().toISOString(), concept: null, bible: null, outline: null,
    eps: {}, canon: [], fs: [], usage: { calls: 0, in: 0, out: 0, usd: 0 }, judge: true,
  };
  setProjects(all);
  S.id = id; S.tab = "work"; S.ep = null;
  $("dNew").close(); refresh(); draw();
};
$("pick").onchange = (e) => { S.id = e.target.value; S.ep = null; draw(); };
window.addEventListener("beforeunload", (e) => { if (S.busy) { e.preventDefault(); e.returnValue = ""; } });

$("ver").textContent = VERSION;
refresh();
draw();
</script>
</body>
</html>
